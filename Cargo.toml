[package]
name = "cv-webpage"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = "0.7.2"
actix-multipart = "0.8.5"
actix-web = "4.18.1"
anyhow = "1.0.104"
askama = "0.16.1"
askama_web = { version = "0.16.0", features = ["actix-web-4"] }
bcrypt = "0.19.3"
diesel = { version = "2.3.14", features = ["postgres", "serde_json", "r2d2"] }
dotenvy = "0.15.7"
env_logger = "0.11.11"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
log = "0.4.34"
pulldown-cmark = "0.13.5"
rpassword = "7"
urlencoding = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
diesel_migrations = "2.3.2"

[build-dependencies]
bcrypt = "0.19.3"
diesel = { version = "2.3.14", features = ["postgres"] }
dotenvy = "0.15.7"
