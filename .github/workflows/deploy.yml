name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Debian 13 matches the VM, so the binary links against a compatible glibc/libpq
    container: rust:1-trixie
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends libpq-dev
      - run: apt-get install -y --no-install-recommends curl ca-certificates && scripts/fetch-htmx.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --no-package-lock @tailwindcss/cli@4 @tailwindcss/typography
          npx @tailwindcss/cli -i input.css -o static/tailwind.css --minify
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: |
          mkdir out
          cp target/release/cv-webpage out/
          cp -r static out/static
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: out
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: out
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "nilsmf.no ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMqd6bAcvTxSnyEE9pPydnaj7SPuzalPvhyq+y+SGx2w" > ~/.ssh/known_hosts
      - name: Upload
        run: |
          chmod +x out/cv-webpage
          rsync -e "ssh -o IdentitiesOnly=yes" out/cv-webpage deploy@nilsmf.no:/opt/cv-webpage/
          rsync -e "ssh -o IdentitiesOnly=yes" -r --delete out/static/ deploy@nilsmf.no:/opt/cv-webpage/static/
      - name: Restart
        run: ssh deploy@nilsmf.no sudo systemctl restart cv-webpage
